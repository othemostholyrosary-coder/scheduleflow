services:
  - type: web
    name: scheduleflow
    runtime: node
    plan: free
    branch: main
    buildCommand: yarn install --immutable --mode=skip-build && yarn workspace @calcom/prisma generate-schemas && yarn workspace @calcom/prisma db-deploy && yarn workspace @calcom/web copy-app-store-static && yarn workspace @calcom/web next build
    startCommand: yarn workspace @calcom/web start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: NEXT_PUBLIC_WEBAPP_URL
        sync: false
      - key: NEXT_PUBLIC_WEBSITE_URL
        sync: false
      - key: NEXT_PUBLIC_EMBED_LIB_URL
        sync: false
      - key: ALLOWED_HOSTNAMES
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: CALENDSO_ENCRYPTION_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: ScheduleFlow
      - key: EMAIL_SERVER_HOST
        sync: false
      - key: EMAIL_SERVER_PORT
        value: "587"
      - key: EMAIL_SERVER_USER
        sync: false
      - key: EMAIL_SERVER_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: ScheduleFlow
      - key: NEXT_PUBLIC_COMPANY_NAME
        value: ScheduleFlow
      - key: SUBY_CHECKOUT_URL
        sync: false
      - key: SUBY_PLAN_ID
        sync: false
      - key: SUBY_WEBHOOK_SECRET
        sync: false
      - key: SUBY_SUCCESS_URL
        sync: false
      - key: SUBY_FAILURE_URL
        sync: false
      - key: SUBY_CANCELLATION_URL
        sync: false
      - key: CALCOM_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_ENV
        value: production
    autoDeploy: true
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - packages/prisma/**
        - package.json
        - yarn.lock
        - .yarnrc.yml
        - render.yaml
